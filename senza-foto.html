<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Menù Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito+Sans:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E6D6BD; --paper-deep:#D9C5A6; --card:#FAF4E6;
    --ink:#2F261C; --ink-soft:#7A6A55;
    --green:#44563B; --green-deep:#2C3925;
    --brown:#8B6845; --taupe:#BBA482;
    --bordeaux:#6C1E2D; --bordeaux-dark:#531624;
    --line:#D3BF9D;
    --shadow:0 10px 30px rgba(47,38,28,0.14);
    --ease:cubic-bezier(.22,.8,.3,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Nunito Sans","Noto Sans Arabic","Noto Sans SC","Noto Sans JP",system-ui,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .serif{font-family:"Cormorant Garamond",Georgia,serif;}
  .progress{position:fixed; top:0; left:0; height:3px; width:0; background:var(--bordeaux); z-index:50; transition:width .08s linear;}
  .demo-banner{background:var(--bordeaux); color:#F4E9DA; text-align:center; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; padding:7px 16px;}

  /* hero */
  .hero{
    position:relative;
    background:radial-gradient(900px 400px at 85% -10%, rgba(255,255,255,.10), transparent 60%), linear-gradient(165deg, var(--green) 0%, var(--green-deep) 100%);
    color:#F1EBDA; padding:56px 20px 36px; text-align:center;
  }
  .hero::after{content:""; position:absolute; inset:auto 0 0 0; height:5px; background:linear-gradient(90deg, var(--bordeaux) 0 40%, var(--taupe) 40% 70%, var(--bordeaux) 70%);}
  .hero .brand{font-size:clamp(3rem,13vw,4.8rem); font-weight:500; line-height:.95; opacity:0; transform:translateY(18px); animation:rise .7s var(--ease) .1s forwards;}
  .hero .brand em{font-style:italic; color:var(--taupe);}
  .hero .tagline{margin-top:14px; font-size:1.05rem; color:#D5CEB8; font-style:italic; opacity:0; transform:translateY(14px); animation:rise .7s var(--ease) .3s forwards;}
  .hero .meta{margin-top:18px; font-size:.82rem; color:#B6AF95; display:flex; justify-content:center; gap:14px; flex-wrap:wrap; opacity:0; animation:fade .6s ease .55s forwards;}
  .hero .hint{margin-top:28px; font-size:.78rem; color:#B6AF95; letter-spacing:.04em; opacity:0; animation:fade .6s ease .9s forwards;}
  .hero .hint i{display:inline-block; animation:bob 1.6s ease-in-out infinite; font-style:normal;}
  @keyframes rise{to{opacity:1; transform:none;}}
  @keyframes fade{to{opacity:1;}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  /* lingua — fisso, fuori da qualsiasi contenitore */
  .lang-wrap{position:fixed; top:40px; inset-inline-end:14px; z-index:60;}
  .lang-btn{
    font:inherit; font-size:.8rem; font-weight:700; letter-spacing:.06em; cursor:pointer;
    background:var(--green-deep); border:1px solid rgba(241,235,218,.35); color:#F1EBDA;
    border-radius:999px; padding:8px 14px; display:flex; align-items:center; gap:7px; box-shadow:var(--shadow);
  }
  .lang-btn svg{width:14px; height:14px; transition:transform .25s var(--ease);}
  .lang-btn[aria-expanded="true"] svg{transform:rotate(180deg);}
  .lang-menu{
    position:absolute; top:calc(100% + 8px); inset-inline-end:0;
    background:var(--card); color:var(--ink); border-radius:14px; box-shadow:var(--shadow);
    padding:6px; min-width:180px; max-height:min(62vh,460px); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    transform-origin:top right; transform:scale(.92); opacity:0; pointer-events:none;
    transition:transform .22s var(--ease), opacity .18s;
  }
  [dir="rtl"] .lang-menu{transform-origin:top left;}
  .lang-menu.open{transform:scale(1); opacity:1; pointer-events:auto;}
  .lang-menu button{
    width:100%; text-align:start; font:inherit; font-size:.92rem; cursor:pointer;
    background:none; border:0; color:var(--ink); padding:10px 12px; border-radius:9px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .lang-menu button:hover{background:var(--paper);}
  .lang-menu button[aria-pressed="true"]{color:var(--bordeaux); font-weight:700;}
  .lang-menu button[aria-pressed="true"]::after{content:"✓";}

  /* nav */
  .nav{position:sticky; top:0; z-index:6; background:rgba(230,214,189,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); transition:box-shadow .3s;}
  .nav.scrolled{box-shadow:0 6px 20px rgba(47,38,28,.10);}
  .nav-inner{max-width:760px; margin:0 auto; padding:0 12px;}
  .tabs{position:relative; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:10px 4px 0;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs a{position:relative; color:var(--ink-soft); text-decoration:none; font-weight:700; font-size:.88rem; padding:8px 14px 12px; white-space:nowrap; transition:color .2s;}
  .tabs a.active{color:var(--green-deep);}
  .tab-ink{position:absolute; bottom:0; height:3px; background:var(--bordeaux); border-radius:3px 3px 0 0; transition:left .35s var(--ease), width .35s var(--ease);}
  .filters{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding:10px 4px 12px;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    font:inherit; font-size:.82rem; font-weight:600; cursor:pointer; white-space:nowrap;
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft);
    border-radius:999px; padding:7px 14px; display:flex; align-items:center; gap:7px;
    transition:background .25s, color .25s, border-color .25s, transform .15s;
  }
  .chip:active{transform:scale(.95);}
  .chip .dot{width:7px; height:7px; border-radius:50%; background:var(--taupe); transition:transform .3s var(--ease);}
  .chip[data-f="sweet"] .dot{background:var(--bordeaux);}
  .chip[data-f="savory"] .dot{background:var(--brown);}
  .chip[data-f="fit"] .dot{background:var(--green);}
  .chip[data-f="vegan"] .dot{background:#5E7A3C;}
  .chip .n{font-size:.68rem; background:var(--paper-deep); color:var(--ink-soft); border-radius:999px; padding:1px 7px; min-width:20px; text-align:center;}
  .chip[aria-pressed="true"]{background:var(--green-deep); border-color:var(--green-deep); color:#F1EBDA;}
  .chip[aria-pressed="true"] .dot{background:#F1EBDA; transform:scale(1.4);}
  .chip[aria-pressed="true"] .n{background:rgba(255,255,255,.18); color:#F1EBDA;}

  /* contenuto */
  main{max-width:760px; margin:0 auto; padding:8px 16px 40px;}
  section{padding-top:38px; scroll-margin-top:110px;}
  .sec-head{display:flex; align-items:baseline; gap:14px; margin-bottom:6px;}
  .sec-head h2{font-size:2rem; font-weight:600; color:var(--green-deep); line-height:1.05;}
  .sec-head .count{font-size:.78rem; color:var(--taupe); font-weight:700;}
  .sec-head::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--bordeaux) 0 28px, var(--line) 28px);}
  .sec-note{color:var(--ink-soft); font-size:1.05rem; font-style:italic; margin-bottom:16px;}

  .grid{display:grid; gap:12px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; position:relative;
    opacity:0; transform:translateY(16px);
    transition:opacity .5s var(--ease), transform .5s var(--ease), box-shadow .25s, border-color .25s;
  }
  .card.in{opacity:1; transform:none;}
  .card:hover{box-shadow:var(--shadow); border-color:var(--taupe);}
  .card .head{display:grid; grid-template-columns:54px 1fr auto; gap:12px; align-items:center; padding:13px 14px; cursor:pointer; user-select:none;}
  body[data-photos="off"] .card .head{grid-template-columns:1fr auto;}
  .card .thumb{width:54px; height:54px; border-radius:14px; background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:1.7rem; border:1px solid var(--line); transition:transform .3s var(--ease);}
  body[data-photos="off"] .thumb{display:none;}
  .card.open .thumb{transform:scale(1.06) rotate(-4deg);}
  .card .title{font-weight:700; font-size:1rem; line-height:1.25;}
  .card .title .v{font-weight:400; color:var(--ink-soft);}
  .card .sub{color:var(--ink-soft); font-size:.8rem; margin-top:3px; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{font-size:.66rem; font-weight:700; letter-spacing:.04em; border-radius:4px; padding:1px 6px; border:1px solid var(--line); color:var(--ink-soft); background:var(--paper);}
  .tag.t-sweet{color:var(--bordeaux); border-color:var(--bordeaux);}
  .tag.t-savory{color:var(--brown); border-color:var(--brown);}
  .tag.t-fit{color:var(--green); border-color:var(--green);}
  .tag.t-gf{color:var(--green-deep); border-color:var(--taupe);}
  .tag.t-vegan{color:#4C6630; border-color:#5E7A3C;}
  .card .price{font-family:"Cormorant Garamond",serif; font-weight:600; font-size:1.3rem; color:var(--bordeaux); white-space:nowrap; display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .card .price .p2{font-size:.95rem; color:var(--brown);}
  .card .chev{width:18px; height:18px; color:var(--taupe); transition:transform .3s var(--ease);}
  .card.open .chev{transform:rotate(180deg); color:var(--bordeaux);}
  .card .body{max-height:0; overflow:hidden; transition:max-height .45s var(--ease); border-top:1px solid transparent;}
  .card.open .body{border-top-color:var(--line);}
  .card .body-in{padding:12px 14px 16px;}
  .ing{display:flex; flex-wrap:wrap; gap:7px;}
  .ing span{background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:.82rem; opacity:0; transform:translateY(6px); transition:opacity .35s var(--ease), transform .35s var(--ease);}
  .card.open .ing span, .sheet.open .ing span{opacity:1; transform:none;}
  .allerg{margin-top:12px; font-size:.84rem; display:flex; align-items:flex-start; gap:8px; color:var(--bordeaux); background:rgba(108,30,45,.07); border-radius:10px; padding:9px 11px;}
  .allerg.none{color:var(--green); background:rgba(68,86,59,.09);}
  .allerg b{font-weight:700; white-space:nowrap;}

  .nut{margin-top:14px; background:rgba(68,86,59,.07); border:1px solid rgba(68,86,59,.18); border-radius:12px; padding:11px 12px;}
  .nut-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .nut-top .kcal{font-family:"Cormorant Garamond",serif; font-size:1.6rem; font-weight:600; color:var(--green-deep); line-height:1;}
  .nut-top .kcal small{font-family:"Nunito Sans",sans-serif; font-size:.72rem; font-weight:700; color:var(--ink-soft); margin-inline-start:4px;}
  .nut-top .per{font-size:.72rem; color:var(--ink-soft); font-style:italic;}
  .macros{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .macro{font-size:.74rem; color:var(--ink-soft);}
  .macro b{display:block; color:var(--ink); font-size:.9rem; font-weight:700;}
  .bar{height:5px; border-radius:5px; background:var(--paper-deep); margin-top:5px; overflow:hidden;}
  .bar i{display:block; height:100%; width:0; border-radius:5px; transition:width .7s var(--ease) .15s;}
  .macro.pro .bar i{background:var(--green);}
  .macro.carb .bar i{background:var(--brown);}
  .macro.fat .bar i{background:var(--bordeaux);}
  .card.open .bar i, .sheet.open .bar i{width:var(--w);}
  .nut-note{font-size:.7rem; color:var(--ink-soft); margin-top:8px; font-style:italic;}

  .more{margin-top:12px; font:inherit; font-size:.82rem; font-weight:700; cursor:pointer; background:none; border:0; color:var(--green-deep); padding:0; border-bottom:1.5px solid var(--taupe); transition:border-color .2s, color .2s;}
  .more:hover{color:var(--bordeaux); border-color:var(--bordeaux);}
  .empty{display:none; text-align:center; color:var(--ink-soft); padding:48px 16px; font-style:italic;}
  .empty.show{display:block;}
  .legend{margin-top:44px; padding:18px 20px; border-radius:16px; background:var(--card); border:1px dashed var(--taupe); color:var(--ink-soft); font-size:.86rem; line-height:1.6;}
  footer{text-align:center; color:var(--ink-soft); font-size:.8rem; padding:24px 16px 56px;}
  footer .proposal{margin-top:6px; color:var(--bordeaux); font-weight:600;}

  /* ---- annunci stagionali ---- */
  .promo-ov{position:fixed; inset:0; background:rgba(44,36,27,.55); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .3s; z-index:34;}
  .promo-ov.open{opacity:1; pointer-events:auto;}
  .promo{position:fixed; left:50%; top:50%; z-index:35; width:min(92vw,440px); transform:translate(-50%,-50%) scale(.92); opacity:0; pointer-events:none; transition:transform .4s var(--ease), opacity .3s;
    background:var(--card); border-radius:22px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.3); border:1px solid var(--line);}
  .promo.open{transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto;}
  .promo .ph{position:relative; padding:28px 22px 20px; color:#F1EBDA; background:linear-gradient(165deg, var(--green) 0%, var(--green-deep) 100%); border-bottom:4px solid var(--bordeaux);}
  .promo .ph.halloween{background:linear-gradient(165deg,#5A3A1E 0%,#2C2016 100%); border-bottom-color:#C8742A;}
  .promo .ph.natale{background:linear-gradient(165deg,#6C1E2D 0%,#3E1019 100%); border-bottom-color:#BBA482;}
  .promo .ph .em{font-size:2.6rem; line-height:1;}
  .promo .ph .kick{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; opacity:.85; margin-top:10px;}
  .promo .ph h3{font-family:"Cormorant Garamond",serif; font-size:1.9rem; font-weight:600; line-height:1.05; margin-top:4px;}
  .promo .ph .dates{font-size:.8rem; opacity:.85; margin-top:6px;}
  .promo .pb{padding:16px 22px 20px;}
  .promo .pb p{font-size:.95rem; color:var(--ink-soft); line-height:1.5;}
  .promo .items{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .promo .items div{display:flex; justify-content:space-between; gap:12px; font-size:.92rem; padding:9px 12px; background:var(--paper); border-radius:10px;}
  .promo .items b{font-family:"Cormorant Garamond",serif; font-size:1.1rem; color:var(--bordeaux);}
  .promo .act{display:flex; gap:10px; margin-top:16px;}
  .promo .act button{flex:1; font:inherit; font-size:.9rem; font-weight:700; cursor:pointer; border-radius:999px; padding:12px 14px; border:1px solid var(--line); background:none; color:var(--ink-soft);}
  .promo .act .go{background:var(--green-deep); border-color:var(--green-deep); color:#F1EBDA;}
  .promo .x{position:absolute; top:12px; inset-inline-end:12px; width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,.35); background:rgba(0,0,0,.18); color:#F1EBDA; font:inherit; cursor:pointer;}
  .ribbon{display:none; align-items:center; gap:10px; max-width:760px; margin:14px auto 0; padding:10px 14px; border-radius:14px; background:var(--card); border:1px solid var(--line); cursor:pointer; font-size:.88rem;}
  .ribbon.show{display:flex;}
  .ribbon .em{font-size:1.3rem;}
  .ribbon b{color:var(--green-deep);}
  .ribbon span.m{color:var(--ink-soft); flex:1;}
  .ribbon .arr{color:var(--bordeaux); font-weight:700;}
  .tag.t-promo{color:#C8742A; border-color:#C8742A;}
  .tag.t-natale{color:var(--bordeaux); border-color:var(--bordeaux);}
  .sec-head h2.sp{color:var(--bordeaux);}

  .toast{position:fixed; bottom:24px; left:50%; transform:translate(-50%,30px); background:var(--green-deep); color:#F1EBDA; font-size:.85rem; font-weight:600; padding:10px 18px; border-radius:999px; box-shadow:var(--shadow); z-index:40; opacity:0; pointer-events:none; transition:opacity .25s, transform .35s var(--ease);}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  .overlay{position:fixed; inset:0; background:rgba(44,36,27,.5); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .3s; z-index:30;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; inset-inline:0; bottom:0; z-index:31; background:var(--card); border-radius:24px 24px 0 0; max-width:760px; margin:0 auto; padding:14px 22px 36px; transform:translateY(105%); transition:transform .42s var(--ease); max-height:86vh; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.2);}
  .sheet.open{transform:translateY(0);}
  .sheet .grab{width:42px; height:5px; border-radius:5px; background:var(--line); margin:0 auto 14px;}
  .sheet .photo{height:180px; border-radius:16px; background:linear-gradient(135deg, var(--paper) 0%, var(--paper-deep) 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); font-size:3.4rem;}
  body[data-photos="off"] .sheet .photo{display:none;}
  .sheet .photo small{font-size:.74rem; color:var(--ink-soft); font-style:italic;}
  .sheet h3{font-size:1.9rem; font-weight:600; color:var(--green-deep); margin-top:16px; line-height:1.1;}
  .sheet h3 .v{font-weight:500; font-style:italic; color:var(--ink-soft); font-size:1.3rem;}
  .sheet .s-price{font-family:"Cormorant Garamond",serif; font-size:1.6rem; font-weight:600; color:var(--bordeaux); margin-top:2px;}
  .sheet .s-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .sheet h4{font-size:.74rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--brown); margin-top:22px; padding-bottom:6px; border-bottom:1px solid var(--line);}
  .sheet .ing{margin-top:12px;}
  .sheet .close{position:absolute; top:14px; inset-inline-end:14px; width:34px; height:34px; border-radius:50%; font:inherit; cursor:pointer; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:1rem;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} .card,.ing span{opacity:1; transform:none;} }
  @media (min-width:640px){ .grid{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body data-photos="off">

<div class="progress" id="progress"></div>
<div class="demo-banner" data-i18n="demoBanner"></div>

<div class="lang-wrap">
  <button class="lang-btn" id="lang-btn" aria-expanded="false" aria-haspopup="listbox"><span id="lang-cur">IT</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 8l5 5 5-5"/></svg></button>
  <div class="lang-menu" id="lang-menu" role="listbox"></div>
</div>

<header class="hero">
  <div class="brand serif">Po’<em>Stò</em></div>
  <p class="tagline serif" data-i18n="tagline"></p>
  <div class="meta"><span>📍 Piazza Daniele Manin 4, Pisa</span><span>🕖 <span data-i18n="hours"></span></span></div>
  <p class="hint"><span data-i18n="scrollHint"></span> <i>↓</i></p>
</header>

<div class="nav" id="nav"><div class="nav-inner">
  <div class="tabs" id="tabs">
    <a href="#speciali" data-sec="speciali" id="tab-speciali" style="display:none"></a>
    <a href="#bakery" data-sec="bakery" data-i18n="catBakery"></a>
    <a href="#salato" data-sec="salato" data-i18n="catSavory"></a>
    <a href="#caffetteria" data-sec="caffetteria" data-i18n="catCoffee"></a>
    <span class="tab-ink" id="tab-ink"></span>
  </div>
  <div class="filters" id="filters">
    <button class="chip" data-f="all" aria-pressed="true"><span data-i18n="fAll"></span><span class="n"></span></button>
    <button class="chip" data-f="sweet" aria-pressed="false"><span class="dot"></span><span data-i18n="fSweet"></span><span class="n"></span></button>
    <button class="chip" data-f="savory" aria-pressed="false"><span class="dot"></span><span data-i18n="fSavory"></span><span class="n"></span></button>
    <button class="chip" data-f="fit" aria-pressed="false"><span class="dot"></span><span data-i18n="fFit"></span><span class="n"></span></button>
    <button class="chip" data-f="gf" aria-pressed="false"><span class="dot"></span><span data-i18n="fGf"></span><span class="n"></span></button>
    <button class="chip" data-f="vegan" aria-pressed="false"><span class="dot"></span><span data-i18n="fVegan"></span><span class="n"></span></button>
  </div>
</div></div>

<div class="ribbon" id="ribbon" role="button" tabindex="0"><span class="em" id="rb-em"></span><b id="rb-t"></b><span class="m" id="rb-m"></span><span class="arr">→</span></div>
<main id="menu"></main>
<p class="empty" id="empty" data-i18n="emptyText"></p>

<footer><div data-i18n="footerNote"></div><div class="proposal" data-i18n="proposalNote"></div></footer>
<div class="toast" id="toast"></div>
<div class="promo-ov" id="promo-ov"></div>
<div class="promo" id="promo" role="dialog" aria-modal="true" aria-labelledby="promo-title">
  <div class="ph" id="promo-head">

ING.cinnamonPumpkin={it:"zucca e cannella",en:"pumpkin and cinnamon",fr:"citrouille et cannelle",de:"Kürbis und Zimt",es:"calabaza y canela",pt:"abóbora e canela",ru:"тыква и корица",ar:"يقطين وقرفة",zh:"南瓜与肉桂",ja:"かぼちゃとシナモン"};
ING.candiedOrange={it:"scorza d'arancia candita",en:"candied orange peel",fr:"écorce d'orange confite",de:"kandierte Orangenschale",es:"piel de naranja confitada",pt:"casca de laranja cristalizada",ru:"цукаты апельсина",ar:"قشر برتقال مسكّر",zh:"糖渍橙皮",ja:"オレンジピール"};
function activePromo(){
  const force=new URLSearchParams(location.search).get("promo");
  if(force){ const p=PROMOS.find(x=>x.id===force); if(p) return p; }
  const now=new Date(); const d=now.toISOString().slice(0,10);
  return PROMOS.find(p=>p.from<=d && d<=p.to) || null;
}
const PROMO=activePromo();
function promoDates(p){ const f=new Date(p.from), t=new Date(p.to); const o={day:"numeric",month:"long"}; const loc={it:"it-IT",en:"en-GB",fr:"fr-FR",de:"de-DE",es:"es-ES",pt:"pt-PT",ru:"ru-RU",ar:"ar",zh:"zh-CN",ja:"ja-JP"}[lang]; return f.toLocaleDateString(loc,o)+" – "+t.toLocaleDateString(loc,o); }
function promoRender(){
  const tab=document.getElementById("tab-speciali"), rb=document.getElementById("ribbon");
  if(!PROMO){ tab.style.display="none"; rb.classList.remove("show"); return; }
  tab.style.display=""; tab.textContent=PROMO.em+" "+PUI[lang].special;
  rb.classList.add("show"); document.getElementById("rb-em").textContent=PROMO.em; document.getElementById("rb-t").textContent=PROMO.title[lang]; document.getElementById("rb-m").textContent=PUI[lang].until+" "+new Date(PROMO.to).toLocaleDateString(lang==="it"?"it-IT":lang,{day:"numeric",month:"long"});
  const ph=document.getElementById("promo-head"); ph.className="ph "+PROMO.id;
  document.getElementById("promo-em").textContent=PROMO.em; document.getElementById("promo-kick").textContent=PUI[lang].kick;
  document.getElementById("promo-title").textContent=PROMO.title[lang]; document.getElementById("promo-dates").textContent=promoDates(PROMO);
  document.getElementById("promo-text").textContent=PROMO.text[lang];
  document.getElementById("promo-items").innerHTML=PROMO.items.map(it=>`<div><span>${it.e} ${it.nm[lang]}${it.vm?` · ${it.vm[lang]}`:""}</span><b>€ ${it.p}</b></div>`).join("");
  document.getElementById("promo-later").textContent=PUI[lang].later; document.getElementById("promo-go").textContent=PUI[lang].go;
}
function promoOpen(){ if(!PROMO) return; document.getElementById("promo-ov").classList.add("open"); document.getElementById("promo").classList.add("open"); document.body.style.overflow="hidden"; }
function promoClose(go){ document.getElementById("promo-ov").classList.remove("open"); document.getElementById("promo").classList.remove("open"); document.body.style.overflow=""; try{sessionStorage.setItem("promo_seen_"+PROMO.id,"1");}catch(e){} if(go){ const s=document.getElementById("speciali"); if(s) s.scrollIntoView({behavior:"smooth",block:"start"}); } }
const tagHtml=tags=>tags.map(x=>`<span class="tag t-${x}">${(x==="promo"||x==="natale")?PUI[lang].special:T("f"+x[0].toUpperCase()+x.slice(1))}</span>`).join("");
const allergHtml=al=>al.length?`<span>⚠️</span><div><b>${T("allergenHas")}</b> ${al.map(k=>AL[k][lang]).join(" · ")}</div>`:`<span>✓</span><div>${T("allergenNone")}</div>`;
function nutHtml(n){
  if(!n) return "";
  const L=NUT[lang];
  const m=(cls,lab,g,ref)=>`<div class="macro ${cls}"><b>${g} g</b>${lab}<div class="bar"><i style="--w:${Math.min(100,Math.round(g/ref*100))}%"></i></div></div>`;
  return `<div class="nut"><div class="nut-top"><div class="kcal">${n.kcal}<small>${L.kcal}</small></div><div class="per">${L.per}</div></div>
    <div class="macros">${m("pro",L.pro,n.pro,40)}${m("carb",L.carb,n.carb,80)}${m("fat",L.fat,n.fat,40)}</div><div class="nut-note">${L.note}</div></div>`;
}

/* ---------- lingua ---------- */
const langBtn=$("lang-btn"), langMenu=$("lang-menu");
LANGS.forEach(([c,l])=>{
  const b=document.createElement("button"); b.textContent=l; b.setAttribute("role","option"); b.setAttribute("aria-pressed",c==="it"?"true":"false");
  b.onclick=e=>{e.stopPropagation(); lang=c; langMenu.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
    $("lang-cur").textContent=c.toUpperCase(); toggleLang(false); closeSheet(); render(); showToast(T("langToast"));};
  langMenu.appendChild(b);
});
function toggleLang(force){const o=force??(langBtn.getAttribute("aria-expanded")!=="true"); langBtn.setAttribute("aria-expanded",o); langMenu.classList.toggle("open",o);}
langBtn.onclick=e=>{e.stopPropagation(); toggleLang();};
document.addEventListener("click",e=>{ if(!langMenu.contains(e.target)&&e.target!==langBtn) toggleLang(false); });
langMenu.addEventListener("touchmove",e=>e.stopPropagation(),{passive:true});

/* ---------- toast ---------- */
let toastT; function showToast(msg){toast.textContent=msg; toast.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove("show"),1600);}

/* ---------- render ---------- */
let observer;
function render(){
  document.documentElement.lang=lang; document.documentElement.dir=(lang==="ar")?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=T(el.dataset.i18n));
  const all=MENU.flatMap(c=>c.items).concat(PROMO?PROMO.items:[]);
  document.querySelectorAll(".chip").forEach(ch=>{const f=ch.dataset.f; ch.querySelector(".n").textContent=f==="all"?all.length:all.filter(i=>i.t.includes(f)).length;});

  main.innerHTML=""; let total=0;
  promoRender();
  const cats = PROMO ? [{id:"speciali",special:true,items:PROMO.items.map(it=>({...it,t:[...it.t,PROMO.tag]}))}, ...MENU] : MENU;
  cats.forEach(cat=>{
    const vis=cat.items.filter(i=>filter==="all"||i.t.includes(filter));
    if(!vis.length) return; total+=vis.length;
    const s=document.createElement("section"); s.id=cat.id;
    s.innerHTML = cat.special
      ? `<div class="sec-head"><h2 class="serif sp">${PROMO.em} ${PROMO.title[lang]}</h2><span class="count">${promoDates(PROMO)}</span></div><p class="sec-note serif">${PROMO.text[lang]}</p>`
      : `<div class="sec-head"><h2 class="serif">${T(cat.title)}</h2><span class="count">${vis.length} ${T("items")}</span></div><p class="sec-note serif">${NOTES[cat.note][lang]}</p>`;
    const grid=document.createElement("div"); grid.className="grid";
    vis.forEach((it,i)=>{
      const card=document.createElement("article"); card.className="card"; card.style.transitionDelay=(i*45)+"ms";
      const price=it.p2?`<span>€ ${it.p}</span><span class="p2">€ ${it.p2}</span>`:`<span>€ ${it.p}</span>`;
      const v=variant(it);
      card.innerHTML=`
        <div class="head" role="button" tabindex="0" aria-expanded="false">
          <div class="thumb">${it.e}</div>
          <div><div class="title">${name(it)}${v?` <span class="v">· ${v}</span>`:""}</div><div class="sub">${tagHtml(it.t)}</div></div>
          <div class="price">${price}<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 8l5 5 5-5"/></svg></div>
        </div>
        <div class="body"><div class="body-in">
          <div class="ing">${it.ing.map((k,j)=>`<span style="transition-delay:${j*40}ms">${ING[k][lang]}</span>`).join("")}</div>
          <div class="allerg ${it.al.length?"":"none"}">${allergHtml(it.al)}</div>
          ${nutHtml(it.nut)}
          <button class="more">${T("more")} →</button>
        </div></div>`;
      const head=card.querySelector(".head"), body=card.querySelector(".body");
      const toggle=()=>{const open=card.classList.toggle("open"); head.setAttribute("aria-expanded",open); body.style.maxHeight=open?body.scrollHeight+"px":"0";};
      head.onclick=toggle; head.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}};
      card.querySelector(".more").onclick=e=>{e.stopPropagation(); openSheet(it);};
      grid.appendChild(card);
    });
    s.appendChild(grid); main.appendChild(s);
  });
  if(total){const lg=document.createElement("div"); lg.className="legend"; lg.textContent=T("legendText"); main.appendChild(lg);}
  emptyMsg.classList.toggle("show",!total);
  if(observer) observer.disconnect();
  observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in"); observer.unobserve(e.target);}}),{threshold:.08});
  document.querySelectorAll(".card").forEach(c=>observer.observe(c));
  requestAnimationFrame(()=>{updateTabInk(); updateActiveTab();});
}

document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f; document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); render();});

/* ---------- annunci: eventi e apertura una volta per visita ---------- */
document.getElementById("promo-x").onclick=()=>promoClose(false);
document.getElementById("promo-later").onclick=()=>promoClose(false);
document.getElementById("promo-ov").onclick=()=>promoClose(false);
document.getElementById("promo-go").onclick=()=>promoClose(true);
const ribbonEl=document.getElementById("ribbon");
ribbonEl.onclick=()=>promoOpen();
ribbonEl.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); promoOpen(); } };
if(PROMO){ let seen=false; try{ seen=!!sessionStorage.getItem("promo_seen_"+PROMO.id); }catch(e){} if(!seen) setTimeout(promoOpen, 900); }

/* ---------- tabs ---------- */
const tabs=$("tabs"), ink=$("tab-ink");
function updateTabInk(){const a=tabs.querySelector("a.active")||tabs.querySelector("a"); if(!a) return; ink.style.left=a.offsetLeft+"px"; ink.style.width=a.offsetWidth+"px";}
function updateActiveTab(){
  const secs=[...document.querySelectorAll("main section")]; if(!secs.length) return;
  let cur=secs[0]; secs.forEach(s=>{if(s.getBoundingClientRect().top-130<=0) cur=s;});
  tabs.querySelectorAll("a").forEach(a=>a.classList.toggle("active",a.dataset.sec===cur.id));
  const act=tabs.querySelector("a.active"); if(act) act.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  updateTabInk();
}
window.addEventListener("resize",updateTabInk);

/* ---------- scroll ---------- */
const nav=$("nav"), prog=$("progress");
window.addEventListener("scroll",()=>{const h=document.documentElement; prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%"; nav.classList.toggle("scrolled",h.scrollTop>160); updateActiveTab();},{passive:true});

/* ---------- sheet ---------- */
const overlay=$("overlay"), sheet=$("sheet");
function openSheet(it){
  const v=variant(it);
  $("sheet-emoji").textContent=it.e;
  $("sheet-title").innerHTML=name(it)+(v?` <span class="v">· ${v}</span>`:"");
  $("sheet-price").textContent="€ "+it.p+(it.p2?"  /  € "+it.p2:"");
  $("sheet-tags").innerHTML=tagHtml(it.t);
  $("sheet-ings").innerHTML=it.ing.map((k,j)=>`<span style="transition-delay:${j*40}ms">${ING[k][lang]}</span>`).join("");
  const a=$("sheet-allergens"); a.className="allerg "+(it.al.length?"":"none"); a.innerHTML=allergHtml(it.al);
  $("sheet-nut").innerHTML=nutHtml(it.nut);
  overlay.classList.add("open"); sheet.classList.add("open"); document.body.style.overflow="hidden";
}
function closeSheet(){overlay.classList.remove("open"); sheet.classList.remove("open"); document.body.style.overflow="";}
overlay.onclick=closeSheet; $("sheet-close").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet(); toggleLang(false);}});

render();
</script>
</body>
</html>
